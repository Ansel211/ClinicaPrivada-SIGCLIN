<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIGCLIN</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>


    <div class="Login-card">
        <header class="header">
        <span class="logo-text">SIGCLIN</span>
        <span class="app-title">SISTEMA DE GESTIÓN DE CLÍNICAS</span>
        </header>
            

        <p>Gestion de citas y pacientes</p> 
        <form id="loginForm">
            <div class="form-group">
                <label for="correo">Correo Electronico</label>
                <input type="email" id="correo" name="correo" placeholder="Ingrese su correo electrónico" required>
            </div>
            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" placeholder="Ingrese su contraseña" required>
            </div>
            
            <div class="form-options">
                <button type="submit" class="btn-login">Iniciar Sesion</button>
            </div>
        </form>
    </div>

    <script src="login.js"></script> 
</body>
</html>
